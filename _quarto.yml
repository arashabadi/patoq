project:
  type: book
  output-dir: docs

book:
  title: "PATOQ"
  author:
    - name: Arash B. Abadi
      url: https://arashabadi.github.io/
    - name: Hossein Asadkhanipour
      url: https://github.com/h-asadkhanipour
  date: last-modified
  cover-image: images/patoq_cover_t.png
  repo-url: https://github.com/arashabadi/patoq
  repo-actions: [edit, issue]
  
  chapters:
    - index.qmd
    - prerequisites.qmd
    - part: "Foundations"
      chapters:
        - biology_fundamentals.qmd
        - mathematics_fundamentals.qmd
        - statistics_fundamentals.qmd
        - computer_science_fundamentals.qmd
    - part: "Core Practice"
      chapters:
        - core-bioinformatics-workflow.qmd
    - part: "Main Sections"
      chapters:
        - omics-data.qmd
        - modeling-simulation.qmd
        - integrated-platforms.qmd
        - specialized-topics.qmd
    - part: "Additional Resources"
      chapters:
        - additional-resources.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      text: |
        <script>
        (() => {
          try {
            const key = "patoq-color-mode";
            const value = localStorage.getItem(key);
            const mode = value === "light" || value === "dark" ? value : "dark";
            if (!value) localStorage.setItem(key, "dark");
            document.documentElement.setAttribute("data-bs-theme", mode);
          } catch {
            document.documentElement.setAttribute("data-bs-theme", "dark");
          }
        })();
        </script>
        <script src="theme-switcher.js"></script>
    number-sections: true
    code-fold: true
    code-tools: true
    repo-url: https://github.com/arashabadi/patoq
    edit-url: https://github.com/arashabadi/patoq/edit/main/
    toc: true
    toc-expand: true
    link-external-icon: true
    link-external-newwindow: true
    navbar:
      right:
        - icon: github
          href: https://github.com/arashabadi/patoq
        - icon: edit
          href: https://github.com/arashabadi/patoq/edit/main/
