project:
  type: book
  output-dir: docs

book:
  title: "PATOQ"
  author:
    - name: Arash B. Abadi
      url: https://arashabadi.github.io/
    - name: Hossein Asadkhanipour
      url: https://github.com/h-asadkhanipour
  date: last-modified
  repo-url: https://github.com/arashabadi/patoq
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    search: true
    collapse-level: 1
  page-footer:
    left: "PATOQ — a gathering place for computational life science"
    right: "[Contribute](https://github.com/arashabadi/patoq/blob/main/CONTRIBUTING.md)"
  
  chapters:
    - index.qmd
    - atlas.qmd
    - learning-map.qmd
    - research-directions.qmd
    - spatial-python.qmd
    - optimal-transport.qmd
    - part: prerequisites.qmd
      chapters: 
        - biology_fundamentals.qmd
        - mathematics_fundamentals.qmd
        - computer_science_fundamentals.qmd
    - part: "Special topics"
      chapters:
        - omics-data.qmd
        - modeling-simulation.qmd
        - integrated-platforms.qmd
        - specialized-topics.qmd
    - part: "Additional Resources"
      chapters:
        - additional-resources.qmd

bibliography: references.bib

format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: [flatly, theme-light.scss]
    css: styles.css
    include-after-body: assets/reader.html
    resources: [assets/reader.css, assets/reader.js]
    highlight-style: arrow
    number-sections: true
    code-fold: true
    code-tools: false
    code-copy: true
    code-overflow: wrap
    repo-url: https://github.com/arashabadi/patoq
    edit-url: https://github.com/arashabadi/patoq/edit/main/
    toc: true
    toc-expand: false
    toc-depth: 2
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    grid:
      sidebar-width: 270px
      body-width: 820px
      margin-width: 220px
      gutter-width: 2.75rem
    navbar:
      right:
        - icon: github
          href: https://github.com/arashabadi/patoq
        - icon: edit
          href: https://github.com/arashabadi/patoq/edit/main/
